previews:
  generation: off

services:
  - type: web
    name: yuki-aion-backend
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8787"
      - key: VIDEO_CACHE_DIR
        value: /data
      - key: AIONLABS_API_KEY
        sync: false
      - key: KOOLBASE_SECRET_KEY
        sync: false
      - key: CLIP_SIGNING_SECRET
        generateValue: true
      - key: AIONLABS_BASE_URL
        value: https://api.aionlabs.ai/v1
      - key: AIONLABS_DEFAULT_MODEL
        value: aion-labs/aion-rp-llama-3.1-8b
      - key: AION_LIMIT_USER_HOURLY
        value: "30"
      - key: AION_LIMIT_USER_DAILY
        value: "200"
      - key: AION_LIMIT_USER_DAILY_TOKENS
        value: "120000"
      - key: AION_LIMIT_GLOBAL_HOURLY
        value: "600"
      - key: AION_LIMIT_GLOBAL_DAILY
        value: "5000"
      - key: AION_MAX_INPUT_CHARS
        value: "12000"
      - key: AION_MAX_MSG_CHARS
        value: "4000"
      - key: AION_MAX_OUTPUT_TOKENS
        value: "700"
      - key: AION_MODELS_CACHE_SECONDS
        value: "600"
      - key: AION_QUOTA_COOLDOWN_SECONDS
        value: "300"
    disk:
      name: yuki-data
      mountPath: /data
      sizeGB: 1
